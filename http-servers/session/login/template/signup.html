<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sign up</title>
  </head>
  <body style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem;">
    {{template "header"}}
    <form method="POST">
      <input type="text" name="name" id="name" placeholder="enter your name"/>
      <input type="text" name="username" id="username" placeholder="enter valid username"/>
      <input type="password" name="password" id="password" placeholder="enter password" />
      <button>submit</button>
    </form>
  </body>
  <style>
    form{
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
    }
    input{
        all:unset;
        border: 1px solid #ebebeb;
        padding: 1rem;
        border-radius: 10px;
    }
    button{
        all:unset;
        padding:1rem;
        background: #ebebeb;
        border-radius: 10px;
        cursor: pointer;
        text-align: center;
        font: 15px Arial, sans-serif;
    }
  </style>
</html>
