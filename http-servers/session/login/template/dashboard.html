<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
  </head>
  <body style="display: flex; flex-direction: column; gap: 1rem;">
    {{ template "header" }}
    {{if .Name}}
      <section style="display: flex;flex-direction:column; text-align: left; align-items: start; padding: 1rem; border-radius: 20px;">
        <div>Name : {{.Name}}</div>
        <div>Username : {{.Username}}</div>
        <div>Password : {{.Password}}</div>
      </section>
    {{end}}
  </body>
</html>
